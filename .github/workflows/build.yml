name: Build README and website

# Regenerates README.md, JOURNALS.md and docs/ whenever the data changes, and once a day so
# "days left" / open / closed statuses stay current. GitHub Pages serves docs/.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build.py
      - name: Commit generated files
        run: |
          if git diff --quiet -- README.md JOURNALS.md docs && [ -z "$(git ls-files --others --exclude-standard -- docs JOURNALS.md)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md JOURNALS.md docs
          git commit -m "Regenerate README, JOURNALS.md and website"
          git push
