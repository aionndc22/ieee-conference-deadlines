# IEEE & IEEE AESS conference deadlines — the single source of truth.
#
# Edit this file to add or update a conference, then open a pull request.
# README.md and the website in docs/ are generated from it automatically
# (see CONTRIBUTING.md for every field and how to preview locally).
#
# Required: id, acronym, url, city, country, format, sources, verified
# Dates are ISO (YYYY-MM-DD). format is one of: In person | Hybrid | Virtual | Not stated
#
# Optional:
#   name            full conference name
#   organizers      sponsoring societies / host institution
#   aess: true      IEEE Aerospace and Electronic Systems Society event (sponsored or co-sponsored)
#   independent: true   run by a college or private organizer; IEEE Xplore inclusion needs IEEE approval
#   venue           hotel / campus / convention centre
#   start, end      conference dates (or dates_text when only the month is known)
#   deadline        main paper (or abstract) submission deadline
#   deadline_type   abstract | full paper | extended abstract | paper summary | digest
#   deadline_text   shown when there is no deadline date (e.g. "Not announced (usually mid-Feb)")
#   deadline_passed: true   deadline is over but its exact date is unknown
#   deadline_note   other key dates or conflicting sources
#   notes           anything else worth knowing

