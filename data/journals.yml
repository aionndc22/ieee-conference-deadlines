# IEEE journals — open-access model, APC and time to first decision.
#
# Single source of truth for JOURNALS.md, docs/journals/ (website page),
# docs/journals.json, docs/journals.csv and docs/IEEE_Journals_APC.xlsx.
# Edit this file and open a pull request; the rest is regenerated (see CONTRIBUTING.md).
#
# pricing:  IEEE's list price per publishing model. Every journal's APC comes from its
#           oa_model unless the journal sets its own `apc` (for titles with special prices).
#
# journals: required  acronym, name, track, type, oa_model
#           optional  aess: true, apc (override, US$), decision_time, decision_source,
#                     decision_url, model_unconfirmed: true, notes, url
#           oa_model is one of the keys under pricing.models.
#           decision_source says who published the figure: Official / Third-party / Crowd-sourced.

pricing:
  year: 2026
  verified: '2026-10-16'
  models:
    Hybrid:
      apc: 2800
      without_oa: Free (overlength page charges may apply)
      meaning: Subscription journal. Publishing is free unless you choose open access; mandatory overlength page charges may apply.
    Fully open access:
      apc: 2160
      without_oa: Not available — OA only
      meaning: 'Gold open access: every accepted article pays the APC. Standard rate for most fully OA titles; a few titles differ.'
    Hybrid magazine:
      apc: 2995
      without_oa: Free (most articles are invited)
      meaning: Magazine with an optional open-access fee (most magazines).
  discounts:
    ieee_member: 0.05
    society_member: 0.2
  sources:
  - https://open.ieee.org/for-authors/article-processing-charges/
  - https://journals.ieeeauthorcenter.ieee.org/wp-content/uploads/sites/7/2026-07-30-IEEE-Article-Processing-Charges-List.pdf
  - https://ieee-aess.org/apc-open-access
  - https://open.ieee.org/for-authors/ieee-low-and-lower-middle-income-country-open-access-discount-program/

